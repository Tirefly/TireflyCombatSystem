; TireflyCombatSystem 插件配置
;
; [CoreRedirects]：**同型改名的正道**（引擎注释原文：「Redirects can now go in any ini file,
; including Plugin inis like PluginName/Config/DefaultPluginName.ini」）。
;
; **为什么需要它**（R5.5-e1 实测）：e1 把关系表族与「打断→取消」族**同型改名**，
; 而改名后**旧名字从反射 schema 消失** ⇒ 资产里存的旧字段名在加载时找不到宿主属性，
; **值被静默丢弃**（探针读出的只是新字段的构造默认值，不是资产里的值）。
; CoreRedirects 让加载器把旧名映射到新名，值随之落到新字段上。
;
; **与 e0 的区别（MUST 记住，两类改名处置完全不同）**：
; - e0 = StatusTag（单 tag）→ CategoryTags（容器）= **类型变更** ⇒ PropertyRedirects **不做**
;   类型转换（引擎只映射同型属性）⇒ 只能「读旧值→写新字段→保存」（编辑器内迁移）；
; - e1 = bInterruptible → bCancellable 等 = **同型改名**（bool→bool / 数组→数组）
;   ⇒ **正是 PropertyRedirects 的适用场景**，用它才是正道。
[CoreRedirects]
; ── 「打断」→「取消」族（R5.5-e1）──────────────────────────────
+PropertyRedirects=(OldName="TcsPhaseSpan.bInterruptible",NewName="bCancellable")
+PropertyRedirects=(OldName="TcsSkillDefData.bInterruptibleDefault",NewName="bCancellableDefault")
; ── 关系表族四字段（R5.5-e1）──────────────────────────────────
; 判据：Blocks → ForbiddenTags（**受动·前置**，约束自己），**MUST NOT** 映射到 TagsToBlock
; （施动·对外，约束目标）——两格词形极近而方向相反，错映射是静默的语义反转。
+PropertyRedirects=(OldName="TcsBuffDef.Blocks",NewName="ForbiddenTags")
+PropertyRedirects=(OldName="TcsBuffDef.Requires",NewName="RequiredTags")
+PropertyRedirects=(OldName="TcsBuffDef.Cancels",NewName="TagsToCancel")
+PropertyRedirects=(OldName="TcsSkillDefData.Blocks",NewName="ForbiddenTags")
+PropertyRedirects=(OldName="TcsSkillDefData.Requires",NewName="RequiredTags")
+PropertyRedirects=(OldName="TcsSkillDefData.Cancels",NewName="TagsToCancel")
; 注：Priority 未改名（它不属关系字段族，归 R5.5-e4），故无重定向。
; 注：枚举值改名（ECFR_Interrupted→ECFR_Canceled / ECT_OnCastInterrupted→…）**不需要**
;     重定向——资产里存的是枚举整数值，不是枚举值名。
